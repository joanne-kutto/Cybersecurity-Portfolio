<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <rect width="820" height="480" fill="#ffffff"/>

  <text x="410" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2328">Lab network architecture</text>

  <!-- Windows host -->
  <rect x="20" y="50" width="780" height="330" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="40" y="76" font-size="14" font-weight="600" fill="#57606a">Windows host running VirtualBox</text>

  <!-- Kali VM -->
  <rect x="50" y="100" width="280" height="240" rx="10" fill="#eaf1fd" stroke="#3b6fd4" stroke-width="2"/>
  <text x="190" y="128" text-anchor="middle" font-size="16" font-weight="600" fill="#1f3f86">Kali Linux VM</text>
  <text x="190" y="148" text-anchor="middle" font-size="12" fill="#1f3f86">Attacker and analyst machine</text>
  <text x="190" y="176" text-anchor="middle" font-size="13" fill="#1f2328">Nmap, Metasploit</text>
  <text x="190" y="198" text-anchor="middle" font-size="13" fill="#1f2328">Burp Suite, Wireshark</text>
  <text x="190" y="220" text-anchor="middle" font-size="13" fill="#1f2328">Suricata IDS</text>

  <!-- Juice Shop in Docker -->
  <rect x="70" y="240" width="240" height="80" rx="8" fill="#fff4e0" stroke="#d98a1c" stroke-width="1.5"/>
  <text x="190" y="272" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">OWASP Juice Shop</text>
  <text x="190" y="294" text-anchor="middle" font-size="12" fill="#57606a">Running in Docker, port 3000</text>

  <!-- Metasploitable2 VM -->
  <rect x="540" y="150" width="240" height="140" rx="10" fill="#fdecec" stroke="#cf3b3b" stroke-width="2"/>
  <text x="660" y="182" text-anchor="middle" font-size="16" font-weight="600" fill="#8c1f1f">Metasploitable2 VM</text>
  <text x="660" y="204" text-anchor="middle" font-size="12" fill="#8c1f1f">Intentionally vulnerable target</text>
  <text x="660" y="238" text-anchor="middle" font-size="12" fill="#1f2328">Vulnerable services:</text>
  <text x="660" y="258" text-anchor="middle" font-size="12" fill="#1f2328">FTP, SMTP, SMB, PostgreSQL</text>

  <!-- Host-only network -->
  <text x="435" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Host-only network</text>
  <text x="435" y="208" text-anchor="middle" font-size="12" fill="#57606a">192.168.56.0/24 (isolated)</text>
  <line x1="332" y1="226" x2="538" y2="226" stroke="#444" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="435" y="248" text-anchor="middle" font-size="12" fill="#1f2328">Scans and exploits</text>
  <text x="435" y="266" text-anchor="middle" font-size="12" fill="#1f2328">Traffic captured and</text>
  <text x="435" y="282" text-anchor="middle" font-size="12" fill="#1f2328">inspected by Suricata</text>

  <!-- Shared folder note -->
  <text x="540" y="332" font-size="12" fill="#57606a">Shared folder: Windows and Kali</text>

  <!-- NAT to internet -->
  <line x1="190" y1="340" x2="190" y2="418" stroke="#6e7781" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="204" y="362" font-size="12" fill="#57606a">NAT adapter, only switched on for updates</text>
  <rect x="90" y="420" width="200" height="40" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
  <text x="190" y="445" text-anchor="middle" font-size="13" fill="#1f2328">Internet</text>
</svg>
